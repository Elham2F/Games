<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أونو السعودية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- زر العودة للرئيسية -->
    <a href="../index.html" class="home-btn" title="الرئيسية">🏠</a>

    <div class="game-table">
        <!-- منطقة الخصم -->
        <div class="player-area" id="opponent-hand"></div>

        <!-- مؤشر اتجاه الدور -->
        <div class="turn-indicator" id="turn-indicator">
            <span id="turn-text">🔽 دورك الآن</span>
        </div>

        <!-- ساحة اللعب -->
        <div class="center-area">
            <div class="deck" id="draw-pile"></div>
            <div class="discard-pile" id="active-card"></div>
        </div>

        <!-- منطقة أوراقك -->
        <div class="player-area" id="my-hand"></div>
    </div>

    <!-- نافذة اختيار اللون -->
    <div id="color-picker-modal" class="modal hidden">
        <div class="modal-content">
            <h3>اختر اللون الجديد:</h3>
            <div class="color-buttons">
                <button class="color-btn color-green" onclick="selectColor('أخضر')">أخضر</button>
                <button class="color-btn color-sand" onclick="selectColor('رملي')">رملي</button>
                <button class="color-btn color-mud" onclick="selectColor('طيني')">طيني</button>
                <button class="color-btn color-sea" onclick="selectColor('بحري')">بحري</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
